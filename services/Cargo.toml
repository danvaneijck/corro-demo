[workspace]
resolver = "3"
members = ["crates/*", "bins/*"]

[workspace.package]
edition = "2024"
publish = false

[workspace.dependencies]
# internal
domain = { path = "crates/domain" }
store = { path = "crates/store" }
adapters = { path = "crates/adapters" }
search = { path = "crates/search" }

# lambda
lambda_http = "1.3"
lambda_runtime = "1.4"
aws_lambda_events = { version = "1.2", default-features = false }
tokio = { version = "1.53", features = ["macros", "rt-multi-thread"] }

# aws. Service crates skip their default `rustls` feature, which pulls in the legacy
# hyper 0.14 / rustls 0.21 stack (and its advisories); `default-https-client` is the current one.
aws-config = { version = "1.12", features = ["behavior-version-latest"] }
aws-sdk-dynamodb = { version = "1.128", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-sts = { version = "1.118", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-secretsmanager = { version = "1.119", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-cognitoidentityprovider = { version = "1.137", default-features = false, features = ["default-https-client", "rt-tokio"] }
serde_dynamo = { version = "4.3", features = ["aws-sdk-dynamodb+1"] }

# general
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ulid = { version = "3.0", features = ["serde"] }
time = { version = "0.3", features = ["formatting", "parsing", "macros", "serde", "serde-well-known"] }
hmac = "0.13"
sha2 = "0.11"
subtle = "2.6"
hex = "0.4"
form_urlencoded = "1.2"
base64 = "0.23"
moka = { version = "0.12", features = ["future"] }
regex = "1.13"
thiserror = "2.0"
anyhow = "1.0"
futures = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
